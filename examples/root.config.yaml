name: root
role: root
segment:
  start_kind: K0
  end_kind: K1
selector_labels:
  environment: production
key_bindings:
  K0:
    sealer:
      name: root-key-sealer
      type: aes256gcm-staticsecret
      config:
        secret:
          type: envvar
          config:
            name: KRYPTON_ROOT_KEY
  K1:
    crypto:
      name: kek-crypto
      type: aes256gcm
    vault:
      name: root-vault
      type: unsafe-sqlite-memory
hierarchy:
  name: production-hierarchy
  key_specs:
    - kind: K0
      role: root
      algorithm: AES256
      labels_spec:
        allow_user_labels: true
    - kind: K1
      role: kek
      algorithm: AES256
      labels_spec:
        allow_user_labels: true
    - kind: K2
      role: tek
      algorithm: AES256
      labels_spec:
        allow_user_labels: true
    - kind: K3
      role: dek
      algorithm: AES256
      labels_spec:
        allow_user_labels: true
topology:
  segments:
    - name: agent-k1
      segment:
        start_kind: K2
        end_kind: K3
      key_bindings:
        K2:
          sealer:
            name: tek-sealer
            type: aes256gcm-staticsecret
            config:
              secret:
                type: envvar
                config:
                  name: KRYPTON_TEK_KEY
          crypto:
            name: tek-crypto
            type: aes256gcm
          vault:
            name: agent-vault
            type: unsafe-sqlite-memory
          parent_key_provider:
            agent_name: root
        K3:
          crypto:
            name: dek-crypto
            type: aes256gcm
          vault:
            name: agent-dek-vault
            type: unsafe-sqlite-memory
      selector_labels:
        cloud: aws
reconciler:
  targets:
    - name: agent-k1
      address: localhost:9091
