apiVersion: v2
type: application
name: krypton-root
description: >-
  Krypton root node: the top of an OpenKCM Krypton key hierarchy. It holds the root keys,
  serves the admin, key and agent gRPC APIs, and optionally a KMIP server.
home: https://github.com/openkcm/krypton
sources:
  - https://github.com/openkcm/krypton
keywords:
  - openkcm
  - krypton
  - key-management
  - kmip
# Version of the chart. Increment it for every change to the chart.
# Versions follow Semantic Versioning (https://semver.org/).
version: 0.1.0
# Krypton release this chart deploys by default: the tag of its image (default of image.tag).
# release-please updates it in each release pull request (marker on the line). Increase
# `version` in the same pull request, otherwise the chart release workflow skips the
# already-published chart version.
appVersion: "v0.1.0" # x-release-please-version
