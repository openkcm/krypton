---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "krypton.fullname" . }}-config
  namespace: {{ include "krypton.namespace" . }}
  labels:
    {{- include "krypton.labels" . | nindent 4 }}
immutable: {{ .Values.config.isImmutable | default false }}
data:
  # Everything under config except the chart setting isImmutable.
  config.yaml: |-
    {{- toYaml (omit .Values.config "isImmutable") | nindent 4 }}
