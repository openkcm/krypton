syntax = "proto3";

package krypton.v1.test.provider;

option go_package = "github.com/openkcm/krypton/pkg/api/v1/proto/test/provider";

// Service simulates an external key provider for testing only.
// The root server registers it only when ENABLE_UNSAFE_TEST_PROVIDER=I_ACCEPT,
// and it also requires UNSAFE_TEST_PROVIDER_DIR to be set.
service Service {
  rpc UpsertInstance(UpsertInstanceRequest) returns (UpsertInstanceResponse);
  rpc UpsertKey(UpsertKeyRequest) returns (UpsertKeyResponse);
  rpc UpsertKeyAuth(UpsertKeyAuthRequest) returns (UpsertKeyAuthResponse);
  rpc DeleteInstance(DeleteInstanceRequest) returns (DeleteInstanceResponse);
}

message UpsertInstanceRequest {
  string instance_id = 1;
}

message UpsertInstanceResponse {}

message UpsertKeyRequest {
  string instance_id = 1;
  string key_id = 2;
}

message UpsertKeyResponse {}

message UpsertKeyAuthRequest {
  string instance_id = 1;
  string key_id = 2;
  string access_token = 3;
}

message UpsertKeyAuthResponse {}

message DeleteInstanceRequest {
  string instance_id = 1;
}

message DeleteInstanceResponse {}
