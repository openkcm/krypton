syntax = "proto3";

package krypton.v1.sealer;

option go_package = "github.com/openkcm/krypton/pkg/api/v1/proto/sealer";

service RouterService {
  rpc LinkKey(LinkKeyRequest) returns (LinkKeyResponse);
  rpc UnlinkKey(UnlinkKeyRequest) returns (UnlinkKeyResponse);
}

message LinkKeyRequest {
  string tenant_id = 1;
  string key_id = 2;
  string external_id = 3;
  Provider provider = 4;
}

message LinkKeyResponse {}

message UnlinkKeyRequest {
  string tenant_id = 1;
  string key_id = 2;
}

message UnlinkKeyResponse {}

message Provider {
  oneof provider {
    StaticSecretProvider static_secret = 1;
  }
}

message StaticSecretProvider {
  string name = 1;
  bytes key_material = 2;
}
